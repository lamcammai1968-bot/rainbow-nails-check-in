<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rainbow Nails Customer Check-In</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#fbf3ec;color:#5b4b45}
body{display:flex;justify-content:center}
.kiosk{width:100%;max-width:1100px;min-height:100vh;padding:22px 24px 24px;background:#fffaf5}
.brand{text-align:center;font-size:30px;font-weight:800;color:#b65b43;margin:0 0 14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
input[type=text],input[type=tel]{width:100%;height:58px;border:2px solid #eaded6;border-radius:16px;padding:0 18px;font-size:20px;background:#fff;color:#4f423d;outline:none}
input:focus{border-color:#d98b73}
.prompt{height:52px;display:flex;align-items:center;justify-content:center;text-align:center;background:#f6c1c9;color:#a62f47;font-weight:800;font-size:19px;border-radius:15px;margin:10px 0 13px}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.service-input{position:absolute;opacity:0;pointer-events:none}
.service{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:103px;border:2px solid #e9ddd5;border-radius:18px;background:#f4ebe4;color:#5d4d47;font-size:19px;line-height:1.12;font-weight:700;padding:10px;cursor:pointer;touch-action:manipulation}
.service .check{display:none;margin-left:7px;font-size:23px;font-weight:900}
.service-input:checked + .service{background:#d97859;border-color:#b9583d;color:#fff;box-shadow:0 4px 12px rgba(150,70,45,.22)}
.service-input:checked + .service .check{display:inline}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.checkin-wrap{position:relative}
#checkin-toggle{position:absolute;opacity:0;pointer-events:none}
.action{min-height:88px;width:100%;border-radius:20px;border:2px solid #ded0c8;font-size:25px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:manipulation}
.checkin-label{background:#d65e3d;color:#fff;border-color:#c34f31;cursor:pointer}
#print-label{background:#fff;color:#b7aaa3;cursor:not-allowed}
#checkin-toggle:checked ~ .checkin-label{background:#5c9b72;border-color:#4d8863}
#checkin-toggle:checked ~ .checkin-label .normal{display:none}
.checkin-label .done{display:none}
#checkin-toggle:checked ~ .checkin-label .done{display:block}
/* Print is enabled after Check In */
#print-link{display:none;background:#fff;color:#8d4937;border-color:#d3a293;cursor:pointer;text-decoration:none}
.actions:has(#checkin-toggle:checked) #print-link{display:flex}
.complete{display:none;margin-top:14px;padding:18px;border-radius:18px;background:#e7f4e9;color:#3f7751;text-align:center;font-size:21px;font-weight:800}
/* completion after print */
#print-now{position:absolute;opacity:0;pointer-events:none}
#print-link{position:relative}
#print-now:checked ~ .complete-area{display:block}
.complete-area{display:none}
.complete-pedi,.complete-nail{display:none}
/* Service-dependent destination — Safari/iPad safe */
.kiosk:has(#print-now:checked) .complete-area{display:block}
.kiosk:has(#print-now:checked) .complete-pedi{display:none}
.kiosk:has(#print-now:checked) .complete-nail{display:none}
.kiosk:has(#pedi1:checked):has(#print-now:checked) .complete-pedi{display:block}
.kiosk:has(#pedi2:checked):has(#print-now:checked) .complete-pedi{display:block}
.kiosk:has(#mani:checked):has(#print-now:checked) .complete-nail{display:block}
.kiosk:has(#acro:checked):has(#print-now:checked) .complete-nail{display:block}
.kiosk:has(#refillacro:checked):has(#print-now:checked) .complete-nail{display:block}
.kiosk:has(#biabfull:checked):has(#print-now:checked) .complete-nail{display:block}
.kiosk:has(#biabrefill:checked):has(#print-now:checked) .complete-nail{display:block}
.kiosk:has(#gel:checked):has(#print-now:checked) .complete-nail{display:block}
.kiosk:has(#other:checked):has(#print-now:checked) .complete-nail{display:block}

@media(max-width:700px){.kiosk{padding:14px 12px 18px}.brand{font-size:25px}.fields{grid-template-columns:1fr}.service{min-height:88px;font-size:16px}.prompt{font-size:16px;height:48px}.action{min-height:76px;font-size:22px}}
</style>
</head>
<body>
<div class="kiosk">
<div class="brand">Rainbow Nails Customer Check-In</div>
<div class="fields">
<input type="text" placeholder="Customer Name" aria-label="Customer Name">
<input type="tel" placeholder="Phone Number" aria-label="Phone Number">
</div>
<div class="prompt">Please select your service first.</div>

<!-- Service selection: pure HTML/CSS, no JavaScript -->
<div class="services">
<input class="service-input" type="radio" name="service" id="pedi1">
<label class="service" for="pedi1">Pedicure<br>Herbal Detox<br>$67 <span class="check">✓</span></label>

<input class="service-input" type="radio" name="service" id="pedi2">
<label class="service" for="pedi2">Pedicure<br>Herbal Detox<br>+ Herbal Foot Steam<br>$82 <span class="check">✓</span></label>

<input class="service-input" type="radio" name="service" id="mani">
<label class="service" for="mani">Manicure <span class="check">✓</span></label>

<input class="service-input" type="radio" name="service" id="acro">
<label class="service" for="acro">Full Set<br>Acrylic <span class="check">✓</span></label>

<input class="service-input" type="radio" name="service" id="refillacro">
<label class="service" for="refillacro">Refill<br>Acrylic <span class="check">✓</span></label>

<input class="service-input" type="radio" name="service" id="biabfull">
<label class="service" for="biabfull">Full Set<br>Builder Gel<br>(BIAB) <span class="check">✓</span></label>

<input class="service-input" type="radio" name="service" id="biabrefill">
<label class="service" for="biabrefill">Refill<br>Builder Gel<br>(BIAB) <span class="check">✓</span></label>

<input class="service-input" type="radio" name="service" id="gel">
<label class="service" for="gel">Gel Polish<br>Painting <span class="check">✓</span></label>

<input class="service-input" type="radio" name="service" id="other">
<label class="service" for="other">Other<br>Services <span class="check">✓</span></label>
</div>

<div class="actions">
<div class="checkin-wrap">
<input id="checkin-toggle" type="checkbox">
<label class="action checkin-label" for="checkin-toggle"><span class="normal">Check In</span><span class="done">✓ Checked In</span></label>
</div>
<label class="action" id="print-link" for="print-now">🖨 Print<br>Ticket</label>
</div>

<input id="print-now" type="checkbox">
<div class="complete-area">
<div class="complete-pedi">Thank You! Please Take a Seat at the Pedicure Chair.</div>
<div class="complete-nail">Thank You! Please Take a Seat at the Nail Table.</div>
</div>
</div>
<script>
(function(){
  /* ===== SAFE CONNECTION SETTINGS =====
     Leave this blank until the Apps Script Web App has been deployed and tested.
     The original MASTER file is untouched.
  */
  const APPS_SCRIPT_WEB_APP_URL = '';

  function getSelectedServiceData(){
    const map = {
      pedi1: {name:'Pedicure Herbal Detox', price:67, area:'Pedicure Chair'},
      pedi2: {name:'Pedicure Herbal Detox + Herbal Foot Steam', price:82, area:'Pedicure Chair'},
      mani: {name:'Manicure', price:'', area:'Nail Table'},
      acro: {name:'Full Set Acrylic', price:'', area:'Nail Table'},
      refillacro: {name:'Refill Acrylic', price:'', area:'Nail Table'},
      biabfull: {name:'Full Set Builder Gel (BIAB)', price:'', area:'Nail Table'},
      biabrefill: {name:'Refill Builder Gel (BIAB)', price:'', area:'Nail Table'},
      gel: {name:'Gel Polish Painting', price:'', area:'Nail Table'},
      other: {name:'Other Services', price:'', area:'Nail Table'}
    };
    const selected = services.find(function(s){ return s.checked; });
    return selected ? map[selected.id] : null;
  }

  async function sendCheckInToAppsScript(){
    if (!APPS_SCRIPT_WEB_APP_URL) return {ok:true, skipped:true};
    const svc = getSelectedServiceData();
    if (!svc) throw new Error('Please select a service first.');
    const payload = {
      customerName: nameInput.value.trim(),
      phone: phoneInput.value.trim(),
      service: svc.name,
      price: svc.price,
      serviceArea: svc.area
    };
    if (!payload.customerName || !payload.phone) throw new Error('Customer Name and Phone Number are required.');
    const response = await fetch(APPS_SCRIPT_WEB_APP_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    const result = await response.json();
    if (!result.ok) throw new Error(result.error || 'Apps Script error.');
    return result;
  }

  const kiosk = document.querySelector('.kiosk');
  const checkin = document.getElementById('checkin-toggle');
  const printNow = document.getElementById('print-now');
  const printLink = document.getElementById('print-link');
  const nameInput = document.querySelector('input[aria-label="Customer Name"]');
  const phoneInput = document.querySelector('input[aria-label="Phone Number"]');
  const services = Array.from(document.querySelectorAll('.service-input'));

  function resetForNextCustomer(){
    // Return the kiosk completely to the first-customer state.
    checkin.checked = false;
    printNow.checked = false;
    nameInput.value = '';
    phoneInput.value = '';
    services.forEach(function(s){ s.checked = false; });
    window.scrollTo(0, 0);
  }

  let backendResult = null;

  checkin.addEventListener('change', async function(){
    if (!checkin.checked) return;
    try {
      backendResult = await sendCheckInToAppsScript();
    } catch (err) {
      checkin.checked = false;
      alert(err.message || 'Check In could not be saved.');
    }
  });

  printLink.addEventListener('click', function(e){
    const selectedService = services.some(function(s){ return s.checked; });
    if (!checkin.checked || !selectedService) {
      e.preventDefault();
      return;
    }
    // The label checks #print-now, so the correct chair/table message appears first.
    setTimeout(function(){ window.print(); }, 80);
  });

  // Reset only after the print action is finished, so the customer can see the
  // chair/table direction first and the next customer gets a clean screen.
  window.addEventListener('afterprint', resetForNextCustomer);
})();
</script>
</body>
</html>
